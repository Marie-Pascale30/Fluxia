# Déploiement complet : HTTPS (Caddy) + web + API + base + sauvegardes. Guide : docs/deploiement.md
#   cp .env.prod.example .env.prod   # puis renseigner domaine, secrets, connecteurs
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Données de démonstration (facultatif, base vide uniquement) :
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile seed run --rm seed

x-logging: &logging
  # Journaux limités en taille (sinon ils remplissent le disque)
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN requis (ex. app.mon-domaine.fr)}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: fluxia
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluxia']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://fluxia:${POSTGRES_PASSWORD}@db:5432/fluxia?schema=public
      PUBLIC_WEB_URL: https://${DOMAIN}
      WEB_ORIGIN: https://${DOMAIN}
    volumes:
      - uploads:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      API_URL: http://api:4000/api
      PUBLIC_WEB_URL: https://${DOMAIN}
    logging: *logging

  # Sauvegarde quotidienne de la base et des fichiers déposés, conservée BACKUP_KEEP_DAYS jours
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: fluxia
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: fluxia
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/data
    entrypoint: ['sh', '/backup.sh']
    logging: *logging

  seed:
    profiles: [seed]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    depends_on: { db: { condition: service_healthy } }
    working_dir: /repo/apps/api
    environment:
      DATABASE_URL: postgresql://fluxia:${POSTGRES_PASSWORD}@db:5432/fluxia?schema=public
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
